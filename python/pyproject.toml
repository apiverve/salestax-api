[project]
name = "apiverve-salestaxlookup"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Sales Tax Lookup is a US sales tax API that finds current sales tax rates for any US ZIP code or two-letter state abbreviation. It returns the jurisdiction state code and the estimated combined tax rate."
keywords = ["sales tax api", "sales tax rate api", "us sales tax api", "tax rate api", "sales tax lookup api"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/salestax?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/salestax?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/salestax-api"
Twitter = "https://twitter.com/apivervehq"
